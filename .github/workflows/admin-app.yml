name: Admin app APK
# Builds the Hulu Admin Android app (android/) and publishes it as the "admin-app" release.
on:
  push:
    branches: [main]
    paths: ["android/**", ".github/workflows/admin-app.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"
      # The signing key is kept in the Actions cache so updates install over the old version.
      - name: Restore signing key
        id: key
        uses: actions/cache@v4
        with:
          path: ~/admin-key
          key: admin-signing-key-v1
      - name: Create signing key
        if: steps.key.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/admin-key
          openssl rand -hex 16 > ~/admin-key/pass
          P="$(cat ~/admin-key/pass)"
          keytool -genkeypair -keystore ~/admin-key/release.jks -storepass "$P" -keypass "$P" \
            -alias hulu -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Hulu Admin"
      - name: Build signed APK
        working-directory: android
        run: |
          export KEYSTORE_PASSWORD="$(cat ~/admin-key/pass)"
          export KEYSTORE_FILE="$HOME/admin-key/release.jks"
          gradle assembleRelease --no-daemon
          cp app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/hulu-admin.apk"
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete admin-app --yes --cleanup-tag || true
          gh release create admin-app "$RUNNER_TEMP/hulu-admin.apk" --title "Hulu Admin app" \
            --notes "Android app for the Hulu admin dashboard. Sign in with the code the bot sends to the owner."
