section{margin:14px 0 4px}section h2{display:flex;align-items:center;justify-content:space-between;margin:0 16px 10px;font-size:19px}
section h2 small{color:var(--lime);font-size:13px;font-weight:600}
.row{display:flex;gap:10px;overflow-x:auto;padding:0 16px 4px;scroll-snap-type:x mandatory;scrollbar-width:none}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(105px,1fr));gap:10px;padding:0 16px}
.t{position:relative;flex:none;width:31%;min-width:105px;max-width:150px;aspect-ratio:3/4;border-radius:14px;overflow:hidden;background:linear-gradient(135deg,#294b42,#182039);scroll-snap-align:start;border:1px solid #ffffff14}

.t:active{transform:scale(.97)}
.note{margin:18px 16px;color:var(--muted);font-size:12px;text-align:center}
footer{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:space-around;padding:8px 0 calc(8px + env(safe-area-inset-bottom));background:#0e1919;border-top:1px solid var(--line);z-index:6}
footer a,footer button{display:flex;flex-direction:column;align-items:center;gap:2px;color:var(--muted);font:inherit;font-size:12px;background:none;border:0}
footer .on{color:var(--lime)}footer i{font-style:normal;font-size:22px}
[hidden]{display:none!important}
</style></head><body>

<script>
const LAUNCH="https://mpzjvjhtubbauwkjozhq.supabase.co/functions/v1/baron-launch?game=";
const HULU="https://hulu-games-web-production.up.railway.app/";
const CATS=[
 {k:"top",l:"⭐ Top",ids:"aviator-x chicken-road aviamaster balloon-pump jetx classic-mines plinko-x hell-7s gates-of-olympus-1000 fast-keno"},
 {k:"crash",l:"🚀 Crash Games",ids:"aviator-x oviator bird-fly tesla-fly balloon-x helicopter-x car-x jetx football-x horse-crash cricket-x crazy-rocket world-champion-x angry-birds fury aviamaster"},
 {k:"step",l:"🐔 Step",ids:"chicken-road chickenroad2 balloon-pump fish-road frog-jump megablock ko-million"},
 {k:"keno",l:"🔢 Keno",ids:"classic-keno fast-keno neo-keno turbo-keno"},
 {k:"bingo",l:"🎱 Bingo",ids:"abra-bingo fast-bingo standard-bingo"},
 {k:"mines",l:"💣 Mines & Plinko",ids:"classic-mines plinko-x plinko-x-classic roll-x ice-fish hilo baccarat"},
 {k:"slots",l:"🍒 Slots",ids:"hell-7s habesha-fortune habesha-fortune-rgs safari-simba savannah-fortune olympian-legends blazinghot big-bass-bonanza big-bass-vegas-1000 gates-of-olympus-1000 casino-island royal-coins-2 fruit-scratch fruit-scratch-rgs diamond-coins"},
 {k:"sport",l:"⚽ Sport & Other",ids:"tinbit fflp ffte flwf"}];
const byId=Object.fromEntries(GAMES.map(g=>[g.id,g]));
const esc=s=>s.replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const tile=g=>`<a class="t" href="${LAUNCH}${g.id}">${g.i?`<img loading="lazy" src="covers/${g.id}.webp" alt="">`:`<span class="ph">🎮</span>`}<b>${esc(g.n)}</b></a>`;
let active="top";
const chips=document.getElementById("chips"),list=document.getElementById("list"),q=document.getElementById("q");
chips.innerHTML=[{k:"all",l:"🎮 All"},...CATS].map(c=>`<button data-chip="${c.k}">${c.l}</button>`).join("");
function render(){
 const v=q.value.trim().toLowerCase();
 chips.querySelectorAll("button").forEach(b=>b.classList.toggle("on",b.dataset.chip===active));
 if(v){const m=GAMES.filter(g=>g.n.toLowerCase().includes(v));list.innerHTML=`<section><h2>🔍 ${m.length} games</h2><div class="grid">${m.map(tile).join("")||"<p>ጨዋታ አልተገኘም</p>"}</div></section>`;return}
 if(active==="all"||active==="top"){list.innerHTML=CATS.map(c=>`<section><h2>${c.l}<small data-chip="${c.k}">All ›</small></h2><div class="row">${c.ids.split(" ").map(id=>tile(byId[id])).join("")}</div></section>`).join("");return}
 const c=CATS.find(c=>c.k===active);list.innerHTML=`<section><h2>${c.l}<small>${c.ids.split(" ").length}</small></h2><div class="grid">${c.ids.split(" ").map(id=>tile(byId[id])).join("")}</div></section>`;
}
document.addEventListener("click",e=>{
 const h=e.target.closest("[data-hulu]");if(h){e.preventDefault();location.href=HULU+(window.TG_HASH||location.hash);return}
 const f=e.target.closest("[data-focus]");if(f){q.focus();return}
 const c=e.target.closest("[data-chip]");if(c){e.preventDefault();active=c.dataset.chip;q.value="";render();scrollTo({top:chips.offsetTop-70,behavior:"smooth"})}
});
q.addEventListener("input",render);
// Real ETB play: only when opened in Telegram and the Hulu server reports real mode on. Otherwise demo via Supabase.
const API=HULU+"api/nebula/",INIT=(()=>{try{return Telegram.WebApp.initData||""}catch(e){return ""}})();
let REAL=false;
const say=m=>{try{Telegram.WebApp.showAlert(m)}catch(e){alert(m)}};
async function wallet(){
 if(!INIT)return;
 try{const r=await fetch(API+"wallet",{headers:{"x-telegram-init-data":INIT}});if(!r.ok)return;const w=await r.json();if(!w.real)return;
  REAL=true;document.querySelector(".bal").innerHTML=`<b>${(w.balance_minor/100).toFixed(2)} ETB</b><small>Wallet</small>`;
  document.querySelector(".note").textContent="በETB እየተጫወቱ ነው። 18+ በኃላፊነት ይጫወቱ። · Playing with real ETB. 18+, play responsibly.";
 }catch(e){}
}
document.addEventListener("click",async e=>{
 const a=REAL&&e.target.closest(`a[href^="${LAUNCH}"]`);if(!a)return;e.preventDefault();e.stopImmediatePropagation();
 try{const r=await fetch(API+"launch",{method:"POST",headers:{"content-type":"application/json","x-telegram-init-data":INIT},body:JSON.stringify({title_id:a.href.slice(LAUNCH.length),mode:"real"})});
  const j=await r.json();if(!r.ok||!j.launch_url)return say(j.error||"ጨዋታው አልተከፈተም · Could not start the game");location.href=j.launch_url;
 }catch(err){say("ግንኙነት አልተሳካም · Connection failed")}
},true);
wallet();

try{Telegram.WebApp.ready();Telegram.WebApp.expand();Telegram.WebApp.setHeaderColor("#0e1919");Telegram.WebApp.setBackgroundColor("#0b1414")}catch(e){}
// Ad posters. To add your own picture: put it in posters/ and add {img:"posters/name.jpg",game:"aviator-x"}.
const POSTERS=[
 {tag:"🔥 HOT",title:"Aviator-X",text:"አውሮፕላኑ ከመብረሩ በፊት ይውጡ! · Cash out before it flies",game:"aviator-x",bg:"linear-gradient(120deg,#3b0a0a,#140606 60%,#000)"},
 {tag:"🐔 NEW",title:"Chicken Road",text:"መንገዱን በሰላም ያሻግሩት · Cross the road, step by step",game:"chicken-road",bg:"linear-gradient(120deg,#3b2a05,#1d1405 60%,#0b0a04)"},
 {tag:"🎰 SLOTS",title:"Gates of Olympus",text:"ዜውስ ይጠብቅዎታል · Free demo spins",game:"gates-of-olympus-1000",bg:"linear-gradient(120deg,#2a0f3d,#140a24 60%,#07040f)"},
 {tag:"🎱 KENO",title:"Fast Keno",text:"ቁጥሮችዎን ይምረጡ · Pick your lucky numbers",game:"fast-keno",bg:"linear-gradient(120deg,#063a33,#06221f 60%,#030f0d)"}];
const track=document.getElementById("track"),dots=document.getElementById("dots");
track.innerHTML=POSTERS.map(p=>p.img?`<a class="slide" href="${LAUNCH}${p.game}"><img class="full" src="${p.img}" alt=""></a>`:`<a class="slide" href="${LAUNCH}${p.game}" style="background:${p.bg}"><img class="bg" src="covers/${p.game}.webp" alt=""><div class="tx"><small>${p.tag}</small><h3>${esc(p.title)}</h3><p>${esc(p.text)}</p><span class="cta">▶ Play</span></div></a>`).join("");
dots.innerHTML=POSTERS.map(()=>"<i></i>").join("");
let slide=0,timer;
function go(n){slide=(n+POSTERS.length)%POSTERS.length;track.style.transform=`translateX(-${slide*100}%)`;[...dots.children].forEach((d,i)=>d.classList.toggle("on",i===slide))}
function auto(){clearInterval(timer);timer=setInterval(()=>go(slide+1),4000)}
let sx=null;const sl=document.getElementById("slider");
sl.addEventListener("touchstart",e=>{sx=e.touches[0].clientX},{passive:true});
sl.addEventListener("touchend",e=>{if(sx===null)return;const dx=e.changedTouches[0].clientX-sx;if(Math.abs(dx)>40){go(slide+(dx<0?1:-1));auto()}sx=null});
go(0);auto();
render();
</script></body></html>
