plugins {
    id "com.android.application"
}

android {
    namespace "et.hulu.games"
    compileSdk 34

    defaultConfig {
        applicationId "et.hulu.games"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    // The CI workflow creates the keystore and passes its path and password in the environment.
    signingConfigs {
        release {
            storeFile file(System.getenv("KEYSTORE_FILE") ?: "release.jks")
            storePassword System.getenv("KEYSTORE_PASSWORD")
            keyAlias "hulu"
            keyPassword System.getenv("KEYSTORE_PASSWORD")
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
